<!DOCTYPE html>
<html lang="en" class="">
	<head data-i18n-title="page_advert">
		<meta http-equiv="refresh" content="2; url=$(link-orig)" />
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="pragma" content="no-cache" />
		<meta http-equiv="expires" content="-1" />
		<title>Internet Hotspot - Advertisement</title>
		<link href="css/style.css" rel="stylesheet" />
		<link href="css/custom.css" rel="stylesheet" />
		<script>
			var popup = '';
			function openOrig() {
				if (window.focus) popup.focus();
				location.href = unescape('$(link-orig-esc)');
			}
			function openAd() {
				location.href = unescape('$(link-redirect-esc)');
			}
			function openAdvert() {
				if (window.name != 'hotspot_advert') {
					popup = open('$(link-redirect)', 'hotspot_advert', '');
					setTimeout('openOrig()', 1000);
					return;
				}
				setTimeout('openAd()', 1000);
			}
		</script>
	</head>
	<body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-300 min-h-screen flex flex-col" onLoad="openAdvert()">
		<!-- Navbar Config (injected by navbars.js) -->
		<script>
			window.navbarConfig = { 
				topNavbar: true, 
				bottomNavbar: false, 
				showQRButton: false
			};
		</script>
		
		<!-- Header will be injected by navbars.js -->

		<div class="flex-1 flex items-center justify-center p-4 text-center">
			<div class="w-full max-w-sm">
				<div class="bg-white dark:bg-gray-800 shadow-lg rounded-lg px-8 py-10">
					<!-- Heroicons: Information Circle (outline) -->
					<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-16 h-16 text-blue-500 mx-auto mb-4">
						<path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
					</svg>
					<h1 class="text-xl font-bold mb-2 text-gray-800 dark:text-gray-200" data-i18n="advertisement">Advertisement</h1>
					<p class="text-gray-600 dark:text-gray-400"><span data-i18n="open_ad_manual">If nothing happens, open</span> <a href="$(link-redirect)" target="hotspot_advert" class="text-blue-500 hover:underline">advertisement</a> <span data-i18n="manually">manually</span>.</p>
				</div>
			</div>
		</div>
		<script src="js/config.js"></script>
		<script src="js/navbars.js"></script>
		<script src="js/app.js"></script>
	</body>
</html>
