<!DOCTYPE html>
<html lang="en" class="">
	<head data-i18n-title="page_logout">
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="pragma" content="no-cache" />
		<meta http-equiv="expires" content="-1" />
		<title>Internet Hotspot - Log out</title>
		<link href="css/style.css" rel="stylesheet" />
		<link href="css/custom.css" rel="stylesheet" />
		<script>
			function openLogin() {
				if (window.name != 'hotspot_logout') return true;
				open('https://$(hostname)/login', '_blank', '');
				window.close();
				return false;
			}
		</script>
	</head>
	<body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-300 min-h-screen">
		<!-- Navbar & Sections Config -->
		<script>
			window.navbarConfig = { 
				topNavbar: true, 
				bottomNavbar: true, 
				showQRButton: false
			};
			window.sectionsConfig = { 
				showSlideshow: true, 
				showVoucherList: true, 
				showFooter: true
			};
		</script>
		
		<!-- Header will be injected by navbars.js -->

		<!-- MAIN CONTENT -->
		<main class="pt-16 px-4 pb-28 max-w-md mx-auto space-y-6">

			<!-- LOGOUT CARD -->
			<section class="bg-white dark:bg-gray-800 rounded-3xl shadow-lg border border-gray-100 dark:border-gray-700 px-6 py-4 relative overflow-hidden">
				<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-orange-500 to-red-500"></div>
				
				<!-- Header -->
				<h1 class="text-xl font-bold text-center mb-4 text-gray-800 dark:text-gray-200" data-i18n="logout_title">You have just logged out!</h1>

				<table id="logout-table" class="w-full text-sm mb-6">
					<tbody>
						<!-- Username -->
						<tr class="logout-row-username border-b border-gray-200 dark:border-gray-700">
							<td class="font-semibold pr-4 py-2 text-gray-600 dark:text-gray-400 text-right" data-i18n="username_label">Username</td>
							<td class="py-2 text-gray-800 dark:text-gray-200"><span id="logout-username">$(username)</span></td>
						</tr>
						
						<!-- IP Address -->
						<tr class="logout-row-ip border-b border-gray-200 dark:border-gray-700">
							<td class="font-semibold pr-4 py-2 text-gray-600 dark:text-gray-400 text-right" data-i18n="ip_address">IP Address</td>
							<td class="py-2 text-gray-800 dark:text-gray-200">$(ip)</td>
						</tr>
						
						<!-- MAC Address -->
						<tr class="logout-row-mac border-b border-gray-200 dark:border-gray-700">
							<td class="font-semibold pr-4 py-2 text-gray-600 dark:text-gray-400 text-right" data-i18n="mac_address">MAC Address</td>
							<td class="py-2 text-gray-800 dark:text-gray-200">$(mac)</td>
						</tr>
						
						<!-- Session Time (Uptime) -->
						<tr class="logout-row-sessiontime border-b border-gray-200 dark:border-gray-700">
							<td class="font-semibold pr-4 py-2 text-gray-600 dark:text-gray-400 text-right" data-i18n="session_time">Session Time</td>
							<td class="py-2 text-gray-800 dark:text-gray-200">$(uptime)</td>
						</tr>
						
						<!-- Time Left -->
						$(if session-time-left)
						<tr class="logout-row-timeleft border-b border-gray-200 dark:border-gray-700">
							<td class="font-semibold pr-4 py-2 text-gray-600 dark:text-gray-400 text-right" data-i18n="time_left">Time Left</td>
							<td class="py-2 text-gray-800 dark:text-gray-200">$(session-time-left)</td>
						</tr>
						$(endif)
						
						<!-- Upload -->
						<tr class="logout-row-upload border-b border-gray-200 dark:border-gray-700">
							<td class="font-semibold pr-4 py-2 text-gray-600 dark:text-gray-400 text-right" data-i18n="upload">Upload</td>
							<td class="py-2 text-gray-800 dark:text-gray-200">$(bytes-in-nice)</td>
						</tr>
						
						<!-- Download -->
						<tr class="logout-row-download border-b border-gray-200 dark:border-gray-700">
							<td class="font-semibold pr-4 py-2 text-gray-600 dark:text-gray-400 text-right" data-i18n="download">Download</td>
							<td class="py-2 text-gray-800 dark:text-gray-200">$(bytes-out-nice)</td>
						</tr>
						
						<!-- Total -->
						<tr class="logout-row-total border-b border-gray-200 dark:border-gray-700">
							<td class="font-semibold pr-4 py-2 text-gray-600 dark:text-gray-400 text-right" data-i18n="total_traffic">Total</td>
							<td class="py-2 text-gray-800 dark:text-gray-200" id="logout-total-traffic">$(bytes-total-nice)</td>
						</tr>
					</tbody>
				</table>

				<!-- Log in button -->
				<form action="https://$(hostname)/login" name="login" onSubmit="return openLogin()">
					<input type="submit" data-i18n-value="logout_login_btn" value="Log in" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md focus:outline-none focus:shadow-outline cursor-pointer" />
				</form>
			</section>

			<!-- SLIDESHOW (Injected by sections.js) -->
			<div id="slideshow-placeholder"></div>

			<!-- VOUCHER LIST (Injected by sections.js) -->
			<div id="voucher-list-placeholder"></div>

			<!-- FOOTER (Injected by sections.js) -->
			<div id="footer-placeholder"></div>

		</main>
		
		<!-- Bottom Navbar will be injected by navbars.js -->

		<script src="js/config.js"></script>
		<script src="js/navbars.js"></script>
		<script src="js/sections.js"></script>
		<script src="js/modals.js"></script>
		<script src="js/app.js"></script>
	</body>
</html>
