<!DOCTYPE html>
<html lang="en" class="">
	<head data-i18n-title="page_redirect">
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="refresh" content="3; url=$(link-redirect)" />
		<meta http-equiv="pragma" content="no-cache" />
		<meta http-equiv="expires" content="-1" />
		<title>Internet Hotspot - Redirect</title>
		<link href="css/style.css" rel="stylesheet" />
		<link href="css/custom.css" rel="stylesheet" />
	</head>
	<body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-300 min-h-screen flex flex-col">
		<!-- Navbar Config (injected by navbars.js) -->
		<script>
			window.navbarConfig = { 
				topNavbar: true, 
				bottomNavbar: false, 
				showQRButton: false
			};
		</script>
		
		<!-- Header will be injected by navbars.js -->

		<div class="flex-1 flex items-center justify-center p-4 text-center">
			<div class="w-full max-w-sm">
				<div class="bg-white dark:bg-gray-800 shadow-lg rounded-lg px-8 py-10">
					<!-- Heroicons: Check Circle (outline) -->
					<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-16 h-16 text-green-500 mx-auto mb-4">
						<path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
					</svg>
					<h1 class="text-xl font-bold mb-2 text-gray-800 dark:text-gray-200" data-i18n="login_success">Login Successful</h1>
					<p class="text-gray-600 dark:text-gray-400"><span data-i18n="redirect_msg">You will be redirected shortly. If nothing happens, click</span> <a href="$(link-redirect)" class="text-blue-500 hover:underline" data-i18n="here">here</a>.</p>
				</div>
			</div>
		</div>
		<script src="js/config.js"></script>
		<script src="js/navbars.js"></script>
		<script src="js/app.js"></script>
	</body>
</html>
