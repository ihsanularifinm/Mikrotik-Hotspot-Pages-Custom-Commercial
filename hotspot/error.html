<!DOCTYPE html>
<html lang="en" class="">
	<head data-i18n-title="page_error">
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="pragma" content="no-cache" />
		<meta http-equiv="expires" content="-1" />
		<title>Internet Hotspot - Error</title>
		<link href="css/style.css" rel="stylesheet" />
		<link href="css/custom.css" rel="stylesheet" />
	</head>
	<body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-300 min-h-screen flex flex-col">
		<!-- Navbar Config (injected by navbars.js) -->
		<script>
			window.navbarConfig = { 
				topNavbar: true, 
				bottomNavbar: false, 
				showQRButton: false
			};
		</script>
		
		<!-- Header will be injected by navbars.js -->

		<div class="flex-1 flex items-center justify-center p-4 text-center">
			<div class="w-full max-w-sm">
				<div class="bg-white dark:bg-gray-800 shadow-lg rounded-lg px-8 py-10">
					<!-- Heroicons: Exclamation Circle (outline) -->
					<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-16 h-16 text-red-500 mx-auto mb-4">
						<path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
					</svg>
					<h1 class="text-xl font-bold mb-2 text-gray-800 dark:text-gray-200" data-i18n="error_title">Hotspot Error</h1>
					<p class="text-red-500 dark:text-red-400 mb-6" data-i18n-error>$(error)</p>
					<a href="$(link-login)" class="w-full inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md focus:outline-none focus:shadow-outline" data-i18n="try_again">Try Again</a>
				</div>
			</div>
		</div>
		<script src="js/config.js"></script>
		<script src="js/navbars.js"></script>
		<script src="js/app.js"></script>
	</body>
</html>
